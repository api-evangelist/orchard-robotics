name: Orchard Robotics
description: >-
  Orchard Robotics (Orchard AI, "The AI Farming Company") is an agricultural
  technology startup founded in 2022 that builds AI-powered camera systems and
  farm-management software for precision fruit and vine growing. Its FruitScope
  platform mounts AI-enabled cameras on any farm vehicle to collect precise
  per-tree and per-vine data — fruit count, size, color, and growth rate —
  which is stored in FruitScope Vault and surfaced through FruitScope OS for
  crop decision-making, with a Vineyard Robotics division serving grape growers.
  Backed by General Catalyst, the company has raised roughly $22M. As of this
  profile Orchard Robotics publishes a marketing and careers website but no
  public API, developer portal, SDK, or documentation surface.
